# テスト一式を PostgreSQL 込みで走らせる。
#
# LLM は呼ばない。テストは FakeLLMClient を使う設計なので API キーは不要で、
# **OPENAI_API_KEY は意図的に与えない。** キーがある環境でだけ走る結合テスト
# （app/nl2sql/tests/test_resolver_scope.py）があり、ダミー値を与えると
# 実APIを叩きにいって落ちるため。
#
# demo_sales スキーマと参照専用ロールは CI では作らない。それらを要する
# 結合テスト（test_sql_executor.py など）は接続できなければ skip される。
name: test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: llm_pipe_lab
        ports:
          - 5432:5432
        # 起動しきる前にテストを始めないよう待つ
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # config/settings.py が読むキー。SECRET_KEY だけは既定値が無く、無いと起動しない
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: llm_pipe_lab
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: localhost
      DB_PORT: "5432"
      # app/nl2sql/core/sql_executor.py の connect_demo が読む。
      # CI にはこのロールが無いので、接続を要するテストは skip される
      DEMO_DB_USER: demo_readonly
      DEMO_DB_PASSWORD: demo_readonly

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: lint（ruff）
        run: ruff check .

      - name: テスト
        run: python manage.py test app

      - name: 実験コマンドの疎通（LLMは呼ばない）
        run: |
          python manage.py run_nl2sql_experiment --dry-run
          python manage.py run_stage2_rule_experiment --dry-run
