{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NL→SQL 実験{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'nl2sql/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'nl2sql_list' %}">NL&rarr;SQL 実験</a>
            <span class="navbar-text text-light ms-4">
                <a href="{% url 'nl2sql_list' %}" class="link-light">&lt;実験一覧&gt;</a>
            </span>
            <span class="navbar-text text-secondary ms-auto small">読み取り専用</span>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} shadow-sm mb-4">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-4 small">
        NL&rarr;SQL Experiment Viewer
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
